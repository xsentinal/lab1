/* Layout: a lab-bench page with a narrow reading column, each experiment a white bench with a dark instrument panel beside its controls. */

}
@media (prefers-color-scheme: dark) {

    --bg: #091016; --surface: #101b23; --surface-2: #15232d; --ink: #e2e9ee; --muted: #8e9ca7;

}
:root[data-theme="dark"] {

  --line: #22323d; --accent: #5cc0da; --accent-ink: #061218; --panel: #050c11; --panel-line: #1a2a35;

}
* { box-sizing: border-box; }
body {

.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

p { margin: 0; }

.intro { max-width: 66ch; color: var(--muted); }
.spec { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-family: var(--font-data); font-size: 12.5px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); white-space: nowrap; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.lang button { border: 0; background: transparent; color: var(--muted); font: 500 13px var(--font-data); padding: 6px 12px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* bench */
section.bench { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 18px; }
.bench h2 { font-size: 22px; font-weight: 600; }
.bench h2 .tag { font-family: var(--font-data); font-size: 12px; font-weight: 500; color: var(--accent); letter-spacing: 0.06em; text-transform: uppercase; display: block; margin-bottom: 4px; }
.lede { color: var(--muted); max-width: 70ch; }

.ctl .hint { font-size: 12.5px; color: var(--muted); font-family: var(--font-data); }
input[type=range] { width: 100%; accent-color: var(--accent); margin: 8px 0 2px; }

.tip b { font-weight: 600; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
button.b { font: 500 14px var(--font-body); padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
button.b:hover { border-color: var(--accent); }
button.b.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.status { background: var(--surface-2); border-radius: 10px; padding: 10px 14px; font-size: 14px; display: flex; flex-direction: column; gap: 2px; }
.status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--muted); }
.status .dot.on { background: #2fbf71; }

/* instrument panel */
.panel { background: var(--panel); border-radius: 12px; padding: 10px; color: var(--panel-ink); min-width: 0; }
.panel svg { display: block; width: 100%; height: auto; }
.flowcap { font-size: 12.5px; color: var(--panel-muted); padding: 2px 6px 4px; }
.pcol { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.tip-h { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.flowtog { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 6px 6px; }
.flowtog .ft { font: 500 12px var(--font-data); padding: 5px 10px; border-radius: 6px; border: 1px solid var(--panel-line); background: transparent; color: var(--panel-muted); cursor: pointer; }
.flowtog .ft[aria-pressed="true"] { background: var(--wire); border-color: var(--wire); color: var(--panel); }

/* readouts */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.tile .k { font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }
.tile .v { font-family: var(--font-data); font-size: 21px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .s { font-size: 12px; color: var(--muted); font-family: var(--font-data); }
.formula { font-family: var(--font-data); font-size: 13px; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; overflow-x: auto; white-space: nowrap; }
.note { font-size: 13px; color: var(--muted); max-width: 80ch; }

/* charts */
.chartbox { position: relative; width: 100%; min-width: 0; }
.chartbox canvas { display: block; width: 100%; }
.chart-dark { background: var(--panel); border-radius: 12px; padding: 8px 6px 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.chart-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; }
.chart-head h3 { font-size: 15px; font-weight: 600; }

/* results */
.results { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
@media (max-width: 760px) { .results { grid-template-columns: minmax(0, 1fr); } }
.results h3 { font-size: 16px; margin-bottom: 8px; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); }
th { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: 0.03em; }
td.n, th.n { text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
td .calc { color: var(--muted); font-size: 12px; }
.calcs { display: flex; flex-direction: column; gap: 10px; }
.calc-row { border-left: 2px solid var(--heat); padding: 2px 0 2px 12px; }
.calc-row .eq { font-family: var(--font-data); font-size: 14px; }
.calc-row .why { font-size: 13px; color: var(--muted); }
.answers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 24px; }
@media (max-width: 760px) { .answers { grid-template-columns: minmax(0, 1fr); } }
.ans { min-width: 0; }
.ans h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.ans .qid { font-family: var(--font-data); font-size: 12px; font-weight: 500; color: var(--accent); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }
.ans p + p { margin-top: 8px; }
footer { font-size: 12.5px; color: var(--muted); text-align: left; max-width: 80ch; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">

          <button class="b" type="button" data-preset="2013" data-i18n="pSteady"></button>

        <span><i style="background:var(--heat)"></i><span data-i18n="lgNow"></span></span>

function update1() {
  const T = +el("t1").value, V = +el("v1").value, r = R(T), I = V / r, P = V * I;
  I1 = I;
  el("t1-out").textContent = fmt(T, 0) + " K";
  el("t1-c").textContent = fmt(T - 273.15, 2) + " °C";
  el("v1-out").textContent = fmt(V, 1) + " V";
  el("r1").textContent = fmt(r, 3) + " Ω";
  el("i1").textContent = fmt(I * 1000, 1) + " mA";
  el("p1").textContent = fmt(P, 3) + " W";
  el("w1").textContent = fmt(wien(T), 2) + " µm";
  el("b1").textContent = Math.round(bright(T) * 100) + " %";
  el("a1").textContent = appearance(T);
  el("f1").textContent = `R(T) ≈ ${fmt(r, 3)} Ω   I = U / R = ${fmt(V, 1)} / ${fmt(r, 3)} = ${fmt(I, 4)} A   P = U × I = ${fmt(P, 4)} W`;
  paintCircuit(c1, V, I, T, t("lamp"), false);
  drawRT(T);
}
function drawRT(Tnow) {
  const cv = el("rt"), [g, w, h] = prep(cv);
  const L = 46, Rr = 14, Tp = 12, B = 30, pw = w - L - Rr, ph = h - Tp - B;
  const x = T => L + T / 2500 * pw, y = r => Tp + ph - r / 90 * ph;
  const ink = css("--ink"), muted = css("--muted"), line = css("--line"), acc = css("--accent"), heat = css("--heat");
  g.font = "11px IBM Plex Mono, monospace"; g.fillStyle = muted; g.strokeStyle = line; g.lineWidth = 1;
  for (let r = 0; r <= 80; r += 20) { g.beginPath(); g.moveTo(L, y(r)); g.lineTo(L + pw, y(r)); g.stroke(); g.textAlign = "right"; g.fillText(r + " Ω", L - 6, y(r) + 4); }
  g.textAlign = "center";
  for (let T = 0; T <= 2500; T += 500) g.fillText(fmt(T, 0) + " K", x(T), h - 10);
  // curve
  g.strokeStyle = ink; g.globalAlpha = 0.55; g.lineWidth = 1.5; g.beginPath();
  PTS.forEach(([T, r], i) => i ? g.lineTo(x(T), y(r)) : g.moveTo(x(T), y(r))); g.stroke();
  g.setLineDash([4, 4]); g.beginPath(); g.moveTo(x(2013), y(R(2013))); g.lineTo(x(2500), y(R(2500))); g.stroke(); g.setLineDash([]); g.globalAlpha = 1;
  // readings
  g.fillStyle = acc; PTS.forEach(([T, r]) => { g.beginPath(); g.arc(x(T), y(r), 4, 0, 7); g.fill(); });
  // now
  const rn = R(Tnow);
  g.strokeStyle = heat; g.lineWidth = 1; g.setLineDash([2, 3]);
  g.beginPath(); g.moveTo(x(Tnow), y(0)); g.lineTo(x(Tnow), y(rn)); g.lineTo(L, y(rn)); g.stroke(); g.setLineDash([]);
  g.fillStyle = heat; g.beginPath(); g.arc(x(Tnow), y(rn), 6, 0, 7); g.fill();
  g.fillStyle = ink; g.textAlign = x(Tnow) > w - 120 ? "right" : "left"; g.font = "12px IBM Plex Mono, monospace";
  g.fillText(`${fmt(rn, 2)} Ω`, x(Tnow) + (g.textAlign === "right" ? -10 : 10), y(rn) - 8);
}
["t1", "v1"].forEach(id => el(id).addEventListener("input", update1));
document.querySelectorAll("[data-preset]").forEach(b => b.addEventListener("click", () => { el("t1").value = b.dataset.preset; el("v1").value = 5; update1(); }));

/* ---------- experiment 2 ---------- */
const c2 = makeCircuit(el("circ2"), true);
const S = { T: TA, t: 0, closed: false, running: true, hist: [], lastStart: null, lastStartT: null, nextSample: 0 };
const V2 = () => +el("v2").value;
const curI = () => S.closed ? V2() / R(S.T) : 0;
function simulate(dtTotal) {
  let left = dtTotal;
  while (left > 0) {
    const h = Math.min(left, 0.0004);
    const I = curI(), P = V2() * I;
    S.T += (P - K1 * (S.T - TA) - K2 * (S.T ** 4 - TA ** 4)) / C * h;
    if (S.T < TA) S.T = TA;
    S.t += h; left -= h;
    if (S.t >= S.nextSample) { S.hist.push([S.t, curI(), S.T]); S.nextSample = S.t + 0.004; }
  }
  while (S.hist.length && S.hist[0][0] < S.t - 5.2) S.hist.shift();
}
function update2() {
  const I = curI(), r = R(S.T);
  el("sw").textContent = S.closed ? t("openSw") : t("closeSw");
  el("run").textContent = S.running ? t("pause") : t("resume");
  el("st").textContent = (S.closed ? t("stClosed") : t("stOpen")) + " · " + (S.running ? t("stRunning") : t("stPaused"));
  el("st-dot").classList.toggle("on", S.closed);
  el("el").textContent = fmt(S.t, 2) + " s";
  el("spd-out").textContent = fmt(+el("spd").value, 2) + "×";
  el("v2-out").textContent = fmt(V2(), 1) + " V";
  el("t2").textContent = fmt(S.T, 0) + " K";
  el("t2c").textContent = fmt(S.T - 273.15, 0) + " °C";
  el("r2").textContent = fmt(r, 3) + " Ω";
  el("i2").textContent = fmt(I * 1000, 1) + " mA";
  el("p2").textContent = fmt(V2() * I, 3) + " W";
  if (S.lastStart == null) { el("s2").textContent = "–"; el("s2c").textContent = t("noStart"); }
  else { el("s2").textContent = fmt(S.lastStart * 1000, 1) + " mA"; el("s2c").textContent = `${t("atT")} ${fmt(S.lastStartT, 0)} K`; }
  el("b2").textContent = Math.round(bright(S.T) * 100) + " %";
  el("b2c").textContent = appearance(S.T);
  paintCircuit(c2, V2(), I, S.T, S.closed || S.T > TA + 5 ? t("hot") : t("cold"), !S.closed);
  if (!S.closed && S.T <= TA + 5) c2.llab.textContent = t("cold");
  if (S.closed) c2.llab.textContent = t("lamp");
  drawSim();
}
function drawSim() {
  const cv = el("sim"), [g, w, h] = prep(cv);
  const L = 44, Rr = 50, Tp = 12, B = 34, pw = w - L - Rr, ph = h - Tp - B;
  const x0 = Math.max(0, S.t - 5), x = s => L + (s - x0) / 5 * pw;
  const yI = i => Tp + ph - Math.min(i, 1.6) / 1.6 * ph, yT = T => Tp + ph - Math.min(T, 2800) / 2800 * ph;
  const pink = css("--panel-ink"), pmut = css("--panel-muted"), pline = css("--panel-line"), wire = css("--wire"), heat = css("--heat");
  g.font = "11px IBM Plex Mono, monospace"; g.lineWidth = 1;
  for (let k = 0; k <= 4; k++) {
    const yy = Tp + ph - k / 4 * ph;
    g.strokeStyle = pline; g.beginPath(); g.moveTo(L, yy); g.lineTo(L + pw, yy); g.stroke();
    g.fillStyle = pmut; g.textAlign = "right"; g.fillText(fmt(k * 0.4, 1), L - 6, yy + 4);
    g.textAlign = "left"; g.fillText(fmt(k * 700, 0), L + pw + 6, yy + 4);
  }
  g.textAlign = "center";
  for (let s = Math.ceil(x0); s <= x0 + 5 + 1e-9; s++) g.fillText(fmt(s, 0), x(s), Tp + ph + 16);
  g.fillStyle = pink; g.fillText(lang === "sv" ? "Simulerad tid (s)" : "Simulated time (s)", L + pw / 2, h - 4);
  const pts = S.hist.filter(p => p[0] >= x0);
  const line = (sel, col, yf) => {
    if (pts.length < 2) return;
    g.strokeStyle = col; g.lineWidth = 2; g.lineJoin = "round"; g.beginPath();
    pts.forEach((p, i) => i ? g.lineTo(x(p[0]), yf(p[sel])) : g.moveTo(x(p[0]), yf(p[sel]))); g.stroke();
    const last = pts[pts.length - 1]; g.fillStyle = col; g.beginPath(); g.arc(x(last[0]), yf(last[sel]), 3.5, 0, 7); g.fill();
  };
  line(2, heat, yT); line(1, wire, yI);
}
el("sw").addEventListener("click", () => {
  S.closed = !S.closed;
  if (S.closed) { S.lastStart = V2() / R(S.T); S.lastStartT = S.T; }
  S.hist.push([S.t, curI(), S.T]);
  update2();
});
el("run").addEventListener("click", () => { S.running = !S.running; update2(); });
el("reset").addEventListener("click", () => { Object.assign(S, { T: TA, t: 0, closed: false, hist: [], lastStart: null, lastStartT: null, nextSample: 0 }); update2(); });
el("adv").addEventListener("click", () => { simulate(1); update2(); });
["spd", "v2"].forEach(id => el(id).addEventListener("input", update2));

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (S.running) simulate(dt * +el("spd").value);
  update2();
  flowStep(c1, I1, dt);
  if (S.running) flowStep(c2, curI(), dt * Math.max(0.25, +el("spd").value));
  requestAnimationFrame(frame);
}

/* ---------- language & theme ---------- */
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(n => { n.innerHTML = t(n.dataset.i18n); });
  el("lang-sv").setAttribute("aria-pressed", lang === "sv");
  el("lang-en").setAttribute("aria-pressed", lang === "en");
  paintFlowLabels(); update1(); update2();
}
["sv", "en"].forEach(l => el("lang-" + l).addEventListener("click", () => { lang = l; try { localStorage.setItem("lab1-lang", l); } catch (e) {} applyLang(); }));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", update1);
new MutationObserver(update1).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
window.addEventListener("resize", update1);

/* open in a working state: switch closed, a moment into warm-up */
S.closed = true; S.lastStart = V2() / R(S.T); S.lastStartT = S.T; S.hist.push([0, S.lastStart, S.T]);
simulate(1.2);
applyLang();
requestAnimationFrame(frame);
})();
</script>
